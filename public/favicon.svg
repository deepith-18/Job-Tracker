<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Vibrant Space Gradient -->
    <linearGradient id="jobOrbitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730a3" />
      <stop offset="35%" stop-color="#4f46e5" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Orbital Trajectory Gradient -->
    <linearGradient id="orbitTrajectory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#e0e7ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Core Sphere Glow -->
    <radialGradient id="coreGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </radialGradient>
  </defs>

  <!-- Modern Squircle Base -->
  <rect width="32" height="32" rx="7.5" fill="url(#jobOrbitBg)" />
  
  <!-- Subtle Glass Inner Border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1" />

  <!-- Back Orbit Ring Arc (Behind Core) -->
  <path d="M 7.5 19.5 C 9.5 24 21 21 24.5 15" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Planetary Career Core Sphere -->
  <circle cx="16" cy="16" r="4.2" fill="url(#coreGlow)" />

  <!-- Primary Foreground Orbital Sweep (Tilted Perspective) -->
  <ellipse cx="16" cy="16" rx="9.8" ry="4.2" transform="rotate(-28 16 16)" stroke="url(#orbitTrajectory)" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="24 7 14 5" fill="none" />

  <!-- Orbiting Opportunity Beacon (Glowing Cyan Satellite) -->
  <circle cx="23.8" cy="11.8" r="2.1" fill="#38bdf8" stroke="#ffffff" stroke-width="0.9" />

  <!-- Tiny Guiding Star -->
  <circle cx="8.5" cy="19.5" r="1.1" fill="#a5f3fc" opacity="0.95" />
</svg>
