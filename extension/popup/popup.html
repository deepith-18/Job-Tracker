<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Orbit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo">
          <svg width="22" height="22" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="36" height="36" rx="10" fill="#4f46e5" />
            <circle cx="20" cy="20" r="4.8" fill="#ffffff" />
            <ellipse cx="20" cy="20" rx="11.5" ry="5.2" transform="rotate(-28 20 20)" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="28 8 16 6" />
            <circle cx="29" cy="15" r="2.4" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Job Orbit</span>
          <span class="brand-subtitle">Pipeline Extension</span>
        </div>
      </div>
      <div id="connection-badge" class="badge badge-disconnected">
        <span class="dot"></span>
        <span id="connection-text">Not Connected</span>
      </div>
    </header>

    <!-- State: Not Logged In -->
    <section id="auth-section" class="view-section hidden">
      <div class="auth-card">
        <div class="auth-header-area">
          <h2 class="auth-heading">Connect Your Workspace</h2>
          <p class="auth-subheading">Link this browser session to your Job Orbit cloud database.</p>
        </div>

        <div class="oauth-sync-box">
          <button type="button" id="btn-sync-tab" class="btn-primary btn-sync">
            <svg class="btn-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
            <span>Sync Session from Open Tab</span>
          </button>
          <p class="auth-helper-note">
            Already logged into your Job Orbit portal in any tab? Click above to automatically link your session.
          </p>
        </div>

        <div class="auth-divider">
          <span>Or sign in with email</span>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" placeholder="name@example.com" autocomplete="email">
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
          </div>
          <div id="login-error" class="error-msg hidden"></div>
          <button type="submit" id="btn-login" class="btn-secondary">
            Sign In with Password
          </button>
        </form>
      </div>
    </section>

    <!-- State: Logged In & Ready to Track -->
    <section id="tracker-section" class="view-section">
      <div class="capture-card">
        <div class="card-top-meta">
          <div class="source-wrapper">
            <span class="meta-label">Source</span>
            <span id="tag-source" class="source-tag">Auto-Detect</span>
          </div>
          <div class="sync-indicator">
            <span class="sync-dot"></span>
            <span>Cloud Connected</span>
          </div>
        </div>

        <div class="form-group">
          <label for="job-role">Role / Position</label>
          <input type="text" id="job-role" placeholder="e.g. Senior Software Engineer" required>
        </div>

        <div class="form-group">
          <label for="job-company">Company</label>
          <input type="text" id="job-company" placeholder="e.g. Stripe" required>
        </div>

        <div class="form-group">
          <label for="job-source">Source / Portal</label>
          <input type="text" id="job-source" list="source-options" placeholder="e.g. LinkedIn, Indeed" value="Auto-Detect">
          <datalist id="source-options">
            <option value="LinkedIn"></option>
            <option value="Indeed"></option>
            <option value="Company Site"></option>
            <option value="Glassdoor"></option>
            <option value="Greenhouse"></option>
            <option value="Lever"></option>
            <option value="Workday"></option>
            <option value="Ashby"></option>
            <option value="ZipRecruiter"></option>
            <option value="Wellfound"></option>
            <option value="Referral"></option>
            <option value="Cold Apply"></option>
            <option value="Other"></option>
          </datalist>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="job-status">Pipeline Status</label>
            <select id="job-status">
              <option value="Applied" selected>Applied</option>
              <option value="Wishlist">Wishlist</option>
              <option value="OA/Assessment">OA / Assessment</option>
              <option value="Interview">Interview</option>
              <option value="Offer">Offer</option>
            </select>
          </div>
          <div class="form-group">
            <label for="job-rating">Interest Rating</label>
            <select id="job-rating">
              <option value="5">Tier 1 - High Priority</option>
              <option value="4">Tier 2 - Strong Match</option>
              <option value="3" selected>Tier 3 - Standard Match</option>
              <option value="2">Tier 4 - Low Priority</option>
              <option value="1">Tier 5 - Exploratory</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="job-notes">Application Notes</label>
          <textarea id="job-notes" rows="2" placeholder="Referral contact, salary target, tech stack details..."></textarea>
        </div>

        <div id="save-status" class="save-status hidden"></div>

        <button id="btn-save-job" class="btn-primary">
          <svg class="btn-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
          <span id="btn-save-text">Save Application</span>
        </button>
      </div>

      <!-- Action Footer -->
      <footer class="footer">
        <button id="btn-open-portal" class="btn-link" title="Open Job Orbit Web Dashboard">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          <span>Open Dashboard</span>
        </button>
        <button id="btn-logout" class="btn-link-muted" title="Sign out of extension">
          Sign Out
        </button>
      </footer>
    </section>
  </div>

  <script src="../lib/firebase-rest.js"></script>
  <script src="popup.js"></script>
</body>
</html>
